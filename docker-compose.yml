name: pi-cloud

services:
  caddy:
    container_name: caddy
    build:
      context: ./caddy
      dockerfile: Dockerfile
      args:
        CADDY_DNS_PLUGIN: ${CADDY_DNS_PLUGIN}
    restart: unless-stopped
    depends_on:
      - immich-server
      - opencloud
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_TLS_ISSUER_CONFIG: ${CADDY_TLS_ISSUER_CONFIG}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/appdata/caddy/data:/data
      - /srv/appdata/caddy/config:/config

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    volumes:
      - ./dashy/conf.yml:/app/user-data/conf.yml:ro

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    command: ["start.sh", "immich"]
    depends_on:
      - immich-redis
      - immich-postgres
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    depends_on:
      - immich-server
    environment:
      TZ: ${TZ}
    volumes:
      - immich-model-cache:/cache
    restart: unless-stopped

  immich-redis:
    container_name: immich_redis
    image: valkey/valkey:8-bookworm
    restart: unless-stopped

  immich-postgres:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_NAME}
      TZ: ${TZ}
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: unless-stopped

  opencloud-init:
    container_name: opencloud_init
    image: opencloudeu/opencloud:latest
    profiles: ["init"]
    command: ["init"]
    environment:
      TZ: ${TZ}
      IDM_ADMIN_PASSWORD: ${OPENCLOUD_ADMIN_PASSWORD}
    volumes:
      - ${OPENCLOUD_CONFIG_LOCATION}:/etc/opencloud
      - ${OPENCLOUD_DATA_LOCATION}:/var/lib/opencloud

  opencloud:
    container_name: opencloud
    image: opencloudeu/opencloud:latest
    environment:
      TZ: ${TZ}
      OC_INSECURE: "true"
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      PROXY_TLS: "false"
      OC_URL: ${OPENCLOUD_URL}
    volumes:
      - ${OPENCLOUD_CONFIG_LOCATION}:/etc/opencloud
      - ${OPENCLOUD_DATA_LOCATION}:/var/lib/opencloud
    restart: unless-stopped

volumes:
  immich-model-cache:
